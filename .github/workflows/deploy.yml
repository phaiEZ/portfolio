# Push to main -> the VPS pulls it and rebuilds the app (scripts/deploy.sh).
# Skipped until the repository variable VPS_HOST is set; setup steps in README "Auto deploy".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# one deploy at a time; a newer push waits for the running one instead of cancelling it mid-build
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.VPS_HOST != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ vars.VPS_HOST }}
          USER_NAME: ${{ vars.VPS_USER || 'deploy' }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the key is locked to scripts/deploy.sh on the server (command= in authorized_keys), so no command is sent
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$USER_NAME@$HOST"
